; OreSweep settings. Read once when the game starts.
[OreSweep]
; 1 = mod on, 0 = off
Enabled=1
; Key to hold while releasing a mining drag (Windows virtual-key code, decimal).
; 17 = Ctrl (default). Avoid 18 = Alt (moves the camera) and 16 = Shift (used by the game).
; Other options: 20 = Caps Lock, or a letter's ASCII code, e.g. 90 = Z, 88 = X
HotkeyVK=17
; 0 = also skip unsurveyed cells (you can't see what's in them), 1 = keep them
KeepUnsurveyed=0
; 1 = write a line to OreSweep.log after every ore-only drag (kept / skipped counts)
DebugLog=0
